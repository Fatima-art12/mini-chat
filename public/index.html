<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Join screen: name + room choose karne ki screen -->
  <div class="join-box" id="joinScreen">
    <div class="join-title">💬 Mini Chat</div>

    <p class="join-label">What is your name?</p>
    <input type="text" id="nameInput" placeholder="Your name..." maxlength="20">

    <p class="join-label">Pick a room</p>
    <div class="room-options" id="roomOptions">
      <button class="room-btn selected" data-room="general">🌸 General</button>
      <button class="room-btn" data-room="study">📚 Study</button>
      <button class="room-btn" data-room="gossip">💬 Gossip</button>
      <button class="room-btn" data-room="gaming">🎮 Gaming</button>
    </div>

    <button class="join-btn" id="joinBtn">Join Chat 💖</button>
  </div>

  <!-- Chat screen: join karne ke baad dikhegi -->
  <div class="chat-box hidden" id="chatBox">
    <div class="chat-header" id="chatHeader">💬 Mini Chat</div>

    <div class="online-bar" id="onlineBar">🟢 Online (0)</div>

    <div class="messages" id="messages">
    </div>

    <div class="typing" id="typing"></div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button id="sendBtn">Send 💖</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Join screen ki cheezein
    const joinScreen = document.getElementById('joinScreen');
    const nameInput = document.getElementById('nameInput');
    const roomOptions = document.getElementById('roomOptions');
    const joinBtn = document.getElementById('joinBtn');

    // Chat screen ki cheezein
    const chatBox = document.getElementById('chatBox');
    const chatHeader = document.getElementById('chatHeader');
    const messages = document.getElementById('messages');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingDiv = document.getElementById('typing');
    const onlineBar = document.getElementById('onlineBar');

    // Join hone ke baad yeh dono set honge
    let username = '';
    let room = 'general';

    // Room button dabane par us ko select karo
    roomOptions.addEventListener('click', (e) => {
      const btn = e.target.closest('.room-btn');
      if (!btn) return;

      document.querySelectorAll('.room-btn').forEach((b) => b.classList.remove('selected'));
      btn.classList.add('selected');
      room = btn.dataset.room;
    });

    // Chat join karne wala function
    function joinChat() {
      username = nameInput.value.trim() || 'Anonymous';

      // Server ko batao ke main kaun hoon aur kis room mein aa rahi hoon
      socket.emit('join', { name: username, room: room });

      // Join screen chupao, chat screen dikhao
      joinScreen.classList.add('hidden');
      chatBox.classList.remove('hidden');
      chatHeader.textContent = '💬 Mini Chat · #' + room;
      input.focus();
    }

    joinBtn.addEventListener('click', joinChat);

    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinChat();
    });

    nameInput.focus();

    // Get the current time (like 11:30 PM)
    function getTime() {
      return new Date().toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Show a normal message on screen
    function addMessage(text, type, name, time) {
      const div = document.createElement('div');
      div.classList.add('message', type);

      if (name) {
        const label = document.createElement('div');
        label.classList.add('sender');
        label.textContent = name;
        div.appendChild(label);
      }

      const msgText = document.createElement('span');
      msgText.textContent = text;
      div.appendChild(msgText);

      if (time) {
        const timeLabel = document.createElement('div');
        timeLabel.classList.add('time');
        timeLabel.textContent = time;
        div.appendChild(timeLabel);
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    // Show a system notice (joined / left)
    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.classList.add('system');
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    // Timer for the typing indicator
    let typingTimeout;

    function sendMessage() {
      const text = input.value.trim();
      if (text === '') return;

      const time = getTime();

      addMessage(text, 'mine', null, time);
      socket.emit('chat message', { name: username, text: text, time: time });
      socket.emit('stop typing');
      clearTimeout(typingTimeout);
      input.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // When I start typing, tell the server
    input.addEventListener('input', () => {
      socket.emit('typing');
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('stop typing');
      }, 3000);
    });

    // When someone else sends a message, show it
    socket.on('chat message', (data) => {
      typingDiv.textContent = '';
      addMessage(data.text, 'other', data.name, data.time);
    });

    // Someone joined or left
    socket.on('system message', (text) => {
      addSystemMessage(text);
    });

    // New online list for this room
    socket.on('online users', (users) => {
      onlineBar.textContent = '🟢 Online (' + users.length + '): ' + users.join(', ');
    });

    // Someone is typing
    socket.on('typing', (name) => {
      typingDiv.textContent = name + ' is typing... ✍️';
    });

    socket.on('stop typing', () => {
      typingDiv.textContent = '';
    });
  </script>

</body>
</html>
